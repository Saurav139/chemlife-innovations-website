AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Chemlife Chatbot API — Dr. Kukku & Dr. Mikku

Globals:
  Function:
    Timeout: 60
    MemorySize: 512

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  PineconeApiKey:
    Type: String
    NoEcho: true
  VoyageApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenaiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  EmbeddingProvider:
    Type: String
    Default: voyage
    AllowedValues: [voyage, openai]

Resources:
  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          PINECONE_API_KEY: !Ref PineconeApiKey
          PINECONE_INDEX_NAME: chemlife-knowledge
          VOYAGE_API_KEY: !Ref VoyageApiKey
          OPENAI_API_KEY: !Ref OpenaiApiKey
          EMBEDDING_PROVIDER: !Ref EmbeddingProvider
          API_CORS_ORIGINS: "https://chemlifeinnovations.com"
          LOG_LEVEL: INFO
      Events:
        ChatApi:
          Type: HttpApi
          Properties:
            Path: /api/chat
            Method: POST
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../../
      DockerTag: latest

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
